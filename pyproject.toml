[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-ronin"
version = "1.0.0"
description = "Autonomous AI-Powered Black-Box API Security Testing Platform"
readme = "docs/README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Project Ronin Team" }
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
full = [
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "pymongo>=4.6.0",
    "docker>=7.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
]

[project.scripts]
ronin = "cli.main:app"

[tool.setuptools]
packages = ["cli", "models", "core"]
